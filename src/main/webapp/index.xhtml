<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:co="http://java.sun.com/jsf/composite/com">

<h:head>
    <title>Danh sách người dùng</title>
</h:head>

<h:body>

    <h:form id="frmList">
        <h:outputText id="count" value="số lượng người dùng: #{userListBean.totalUsers}"/>
        <p:dataTable id ="table" var="u" value="#{userListBean.lazyUsers}" rows="5" paginator="true" emptyMessage="Không có dữ liệu">
          <p:column headerText="Tên">
              <h:outputText value="#{u.name}"/>
          </p:column>
          <p:column headerText="Ngày sinh">
              <h:outputText value="#{u.birthDay}">
                  <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="Asia/Ho_Chi_Minh"/>
              </h:outputText>
          </p:column>
          <p:column headerText="Ngày tạo">
              <h:outputText value="#{u.created}">
                  <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="Asia/Ho_Chi_Minh"/>
              </h:outputText>
          </p:column>
        </p:dataTable>
    </h:form>

    <p:commandButton value="Thêm người dùng" type="button" onclick="PF('dlgAdd').show()"/>
    <p:dialog header="Thêm người dùng" widgetVar="dlgAdd" modal="true" resizable="false">
        <h:form id="frmAdd">
            <h:panelGrid columns="2">
                <p:outputLabel for="name" value="Tên người dùng"/>
                <p:inputText id="name" value="#{userListBean.name}" required="true" requiredMessage="Tên không được để trống"/>
                <p:outputLabel for="birth" value="Ngay sinh(dd/MM/yyyy)"/>
                <p:inputText id="birth" value="#{userListBean.birthDay}">
                    <f:convertDateTime pattern="dd/MM/yyyy" timeZone="Asia/Ho_Chi_Minh"/>
                </p:inputText>
            </h:panelGrid>
            <p:messages id="msgs"/>
            <p:commandButton value="Thêm" action="#{userListBean.createUser}" update="msgs :Notification:msgSucces :frmList:count :frmList:table" oncomplete="if(args.saved) PF('dlgAdd').hide()"/>
        </h:form>
    </p:dialog>
    <h:form id="Notification">
        <p:messages id="msgSucces" closable="true" showDetail="true"/>
    </h:form>
</h:body>

</html>
